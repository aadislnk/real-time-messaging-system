server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: sandesh-backend

  web:
    error:
      include-message: never
      include-stacktrace: never

  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sandesh}
    username: ${SPRING_DATASOURCE_USERNAME:sandesh}
    password: ${SPRING_DATASOURCE_PASSWORD}

    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 3000

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}

    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  jackson:
    default-property-inclusion: non_null

sandesh:
  security:
    jwt-secret: ${SANDESH_JWT_SECRET}
    access-token-ttl: ${SANDESH_ACCESS_TOKEN_TTL:7d}

  websocket:
    allowed-origins: ${SANDESH_WS_ALLOWED_ORIGINS:http://localhost:4173,http://localhost:4200}