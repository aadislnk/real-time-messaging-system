server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: sandesh-backend

  web:
    error:
      include-message: never
      include-stacktrace: never

  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sandesh}
    username: ${SPRING_DATASOURCE_USERNAME:sandesh}
    password: ${SPRING_DATASOURCE_PASSWORD}

    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 3000

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}

    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2s

      repositories:
        enabled: false

  jackson:
    default-property-inclusion: non_null

sandesh:
  security:
    jwt-secret: ${SANDESH_JWT_SECRET}
    access-token-ttl: ${SANDESH_ACCESS_TOKEN_TTL:7d}

  messaging:
    realtime-channel: ${SANDESH_REALTIME_CHANNEL:sandesh:realtime}
    stream-key: sandesh:message-events
    consumer-group: sandesh-delivery
    consumer-name: ${HOSTNAME:local-worker}
    outbox-poll-delay-ms: 100
    delivery-poll-delay-ms: 100


  presence:
   ttl: 30s

  websocket:
    allowed-origins: ${SANDESH_WS_ALLOWED_ORIGINS:http://localhost:4173,http://localhost:4200}

  rate-limit:
    messages-per-minute: ${SANDESH_RATE_LIMIT_MESSAGES_PER_MINUTE:60}