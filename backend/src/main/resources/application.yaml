server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: sandesh-backend

  config:
    import: optional:file:.env[.properties]

  web:
    error:
      include-message: never
      include-stacktrace: never

  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sandesh}
    username: ${SPRING_DATASOURCE_USERNAME:sandesh}
    password: ${SPRING_DATASOURCE_PASSWORD}

    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 3000

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}

    properties:
      hibernate:
        jdbc:
          time_zone: UTC

        order_updates: true
        order_inserts: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2s

      repositories:
        enabled: false

  jackson:
    default-property-inclusion: non_null

sandesh:
  # Explicit browser origins used by REST CORS and the STOMP handshake.
  # SANDESH_WS_ALLOWED_ORIGINS is retained as a legacy fallback.
  allowed-origins: ${SANDESH_ALLOWED_ORIGINS:${SANDESH_WS_ALLOWED_ORIGINS:http://localhost:4173,http://localhost:4200,http://localhost:5173}}

  security:
    jwt-secret: ${SANDESH_JWT_SECRET}
    access-token-ttl: ${SANDESH_ACCESS_TOKEN_TTL:7d}

  messaging:
    realtime-channel: ${SANDESH_REALTIME_CHANNEL:sandesh:realtime}
    stream-key: sandesh:message-events
    consumer-group: sandesh-delivery
    consumer-name: ${HOSTNAME:local-worker}
    outbox-poll-delay-ms: 100
    delivery-poll-delay-ms: 100
  websocket:
    endpoint: ${SANDESH_WEBSOCKET_ENDPOINT:/ws}

  rate-limit:
    messages-per-minute: ${SANDESH_RATE_LIMIT_MESSAGES_PER_MINUTE:60}